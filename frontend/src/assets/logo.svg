<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="dhGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F766E" flood-opacity="0.25"/>
    </filter>
  </defs>

  {/* Outer Rounded Container */}
  <rect width="100" height="100" rx="26" fill="url(#dhGradient)" />

  {/* Decorative Subtle Inner Glow */}
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.5" />

  {/* Graduation Cap Top Diamond */}
  <polygon points="50,22 82,36 50,50 18,36" fill="url(#accentGradient)" />

  {/* Cap Neck / Base */}
  <path d="M30 43.5V57C30 63.5 39 68.5 50 68.5C61 68.5 70 63.5 70 57V43.5L50 52.5L30 43.5Z" fill="url(#accentGradient)" opacity="0.9" />

  {/* Book Pages Base / Hub Arc */}
  <path d="M22 66C32 62 43 62 50 65C57 62 68 62 78 66V75C68 71 57 71 50 74C43 71 32 71 22 75V66Z" fill="#FFFFFF" opacity="0.95" />

  {/* Tassel Circle & String */}
  <path d="M82 36V54" stroke="#CCFBF1" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="82" cy="56" r="3" fill="#CCFBF1" />
</svg>
